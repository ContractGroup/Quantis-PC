<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dedicated iOS PWA / "Add to Home Screen" icon.
  iOS doesn't support theme-adaptive home-screen icons, so we bake an opaque
  brand-purple tile and invert the logo to white. This reads correctly on
  both light and dark home screens, and doesn't rely on transparency falling
  back to a system-default (black) backdrop.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <!-- Full-bleed brand tile. iOS will round the corners to its own mask. -->
    <rect width="1024" height="1024" fill="#5d147c"/>
    <g fill="#ffffff">
